<!DOCTYPE html>
<html>
<head>
  <title>Yeah</title>

  <style>
    .floating-gif {
  position: absolute;
  width: 100px;
  pointer-events: none;
  animation: float 5s linear infinite;
}

@keyframes float {
  0% {
    transform: translateY(0px) rotate(0deg);
    opacity: 1;
  }
  100% {
    transform: translateY(-800px) rotate(360deg);
    opacity: 0;
  }
}
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      background: black;
      color: white;
      font-family: Arial;
      text-align: center;
    }

    .images {
      display: flex;
      gap: 20px;
      margin-top: 20px;
    }

    img {
      max-width: 200px;
      border-radius: 10px;
    }
  </style>
</head>
<body>

  <h1 id="text">...</h1>

  <div class="images">
    <img id="img1">
    <img id="img2">
  </div>

  <script>
    const gifs = [
  "1edbf144909f2bbfcff412393422984c.gif",
  "14406a6326bac5ccac8a3f09a122dcac.gif",
  "1051082n9y27qwafc.gif"
];

function spawnGif() {
  const gif = document.createElement("img");
  gif.src = gifs[Math.floor(Math.random() * gifs.length)];
  gif.className = "floating-gif";

  // สุ่มตำแหน่งแนวนอน
  gif.style.left = Math.random() * window.innerWidth + "px";

  // เริ่มจากด้านล่างจอ
  gif.style.top = window.innerHeight + "px";

  // สุ่มขนาด
  gif.style.width = (50 + Math.random() * 100) + "px";

  document.body.appendChild(gif);

  // ลบออกหลัง animation จบ
  setTimeout(() => {
    gif.remove();
  }, 5000);
}

// สร้างกิฟใหม่ทุก 500ms
setInterval(spawnGif, 500);
    const texts = [
      "Im fucking WEEB!!",
      "Hi LOL",
      "DM pls",
      "Bruh"
    ];

    const images = [
      "downloado.png",
      "downloadS.png",
      "downloadK.png",
      "downloadM.png"
    ];

    // สุ่มข้อความ
    document.getElementById("text").innerText =
      texts[Math.floor(Math.random() * texts.length)];

    // สุ่มรูป 2 รูป (ไม่ให้ซ้ำ)
    let i1 = Math.floor(Math.random() * images.length);
    let i2;

    do {
      i2 = Math.floor(Math.random() * images.length);
    } while (i1 === i2);

    document.getElementById("img1").src = images[i1];
    document.getElementById("img2").src = images[i2];
  </script>

</body>
</html>
