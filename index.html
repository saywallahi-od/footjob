<!DOCTYPE html>
<html>
<head>
  <title>555</title>

  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      background: black;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    img {
      margin-top: 20px;
      max-width: 300px;
      border-radius: 10px;
    }
  </style>
</head>

<body>

  <h1 id="text">...</h1>
  <img id="meme" src="">

  <script>
    const texts = [
      "โดนหลอก 555",
      "กดมาทำไมเนี่ย",
      "เสียเวลาไปอีก 3 วิ",
      "ยังไม่ออกอีกเหรอ 😂",
      "เว็บนี้ไม่มีอะไรจริงๆ"
    ];

   const images = [
  "wodx30ff6ku61.png",
  "meme2.jpg",
  "meme3.jpg"
];

    // สุ่มข้อความ
    const randomText = texts[Math.floor(Math.random() * texts.length)];
    document.getElementById("text").innerText = randomText;

    // สุ่มรูป
    const randomImg = images[Math.floor(Math.random() * images.length)];
    document.getElementById("meme").src = randomImg;
  </script>

</body>
</html>
