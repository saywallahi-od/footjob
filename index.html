<!DOCTYPE html>
<html>
<head>
  <title>Yeah</title>

  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      background: black;
      color: white;
      font-family: Arial;
      text-align: center;
    }

    .images {
      display: flex;
      gap: 20px;
      margin-top: 20px;
    }

    img {
      max-width: 200px;
      border-radius: 10px;
    }
  </style>
</head>

<body>

  <h1 id="text">...</h1>

  <div class="images">
    <img id="img1">
    <img id="img2">
  </div>

  <script>
    const texts = [
      "โดนหลอก 555",
      "ยังไม่ออกอีกเหรอ",
      "เสียเวลาไปฟรีๆ",
      "เว็บไม่มีอะไรจริงๆ"
    ];

    const images = [
      "downloado.png",
      "downloadS.png",
      "downloadK.png",
      "downloadM.png"
    ];

    // สุ่มข้อความ
    document.getElementById("text").innerText =
      texts[Math.floor(Math.random() * texts.length)];

    // สุ่มรูป 2 รูป (ไม่ให้ซ้ำ)
    let i1 = Math.floor(Math.random() * images.length);
    let i2;

    do {
      i2 = Math.floor(Math.random() * images.length);
    } while (i1 === i2);

    document.getElementById("img1").src = images[i1];
    document.getElementById("img2").src = images[i2];
  </script>

</body>
</html>
